<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QR Code Generator</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}.header{width:100%;background:#1e293b;padding:14px 24px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}.header h1{font-size:17px}.header a{color:#3b82f6;text-decoration:none;font-size:13px}.container{flex:1;padding:30px 20px;max-width:500px;width:100%;text-align:center}h2{font-size:22px;margin-bottom:6px}.sub{color:#94a3b8;margin-bottom:20px;font-size:14px}textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:14px;margin-bottom:12px;min-height:70px}.btn{width:100%;padding:12px;background:#f59e0b;color:#000;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;margin-bottom:16px}.qr-wrap{padding:16px;background:#fff;border-radius:12px;display:inline-block}.footer{width:100%;text-align:center;padding:12px;color:#475569;font-size:12px;border-top:1px solid #1e293b;margin-top:auto}.footer a{color:#64748b}</style></head><body>
<div class="header"><h1>📱 QR Code Generator</h1><a href="https://pyfile-toolkit.github.io/web-toolkit/">← Tools</a></div>
<div class="container"><h2>Generate QR Code</h2><p class="sub">Enter text or URL — works offline, no data sent anywhere</p>
<textarea id="input" placeholder="Text or URL..." oninput="gen()">https://pyfile-toolkit.github.io/web-toolkit/</textarea>
<button class="btn" onclick="gen()">📱 Generate QR</button>
<div class="qr-wrap"><canvas id="qr"></canvas></div></div>
<div class="footer"><a href="https://pyfiletoolkit.gumroad.com">PRO: QR with logo + bulk generation</a></div>
<script>
function gen(){const t=document.getElementById('input').value;const c=document.getElementById('qr');const s=280;c.width=s;c.height=s;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,s,s);if(!t)return;const u='https://api.qrserver.com/v1/create-qr-code/?size='+s+'x'+s+'&data='+encodeURIComponent(t);const img=new Image();img.onload=function(){ctx.drawImage(img,0,0,s,s)};img.src=u}
gen()
</script></body></html>
