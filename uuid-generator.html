<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID Generator — Free Online Tool</title>
<meta name="description" content="Generate random UUID v4 online. Free, instant, no server needed.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#1e293b;border-radius:16px;padding:32px;max-width:500px;width:100%;text-align:center}
h1{color:#f8fafc;margin-bottom:4px}
.sub{color:#94a3b8;margin-bottom:24px;font-size:.9rem}
.uuid{font-family:monospace;font-size:1.3rem;background:#334155;padding:16px;border-radius:8px;margin-bottom:16px;word-break:break-all;color:#818cf8}
button{padding:10px 28px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem}
button:hover{background:#4f46e5}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-copy{background:#64748b}
.btn-bulk{background:#f59e0b}
.bulk{margin-top:16px;text-align:left}
.bulk textarea{width:100%;padding:12px;border-radius:8px;background:#334155;color:#e2e8f0;border:1px solid #475569;font-family:monospace;font-size:.85rem;min-height:120px;margin-top:8px}
.ads{margin-top:20px;padding:12px;background:#1e1e3a;border-radius:8px;font-size:.85rem}
.ads a{color:#818cf8}
</style>
</head>
<body>
<div class="card">
<h1>UUID Generator</h1>
<p class="sub">Click to generate. Uses crypto.randomUUID() — truly random.</p>
<div class="uuid" id="uuid">Click generate...</div>
<div class="btns">
<button onclick="gen()">🎲 Generate</button>
<button class="btn-copy" onclick="copy()">📋 Copy</button>
<button class="btn-bulk" onclick="bulk()">📦 Generate 10</button>
</div>
<div class="bulk" id="bulkSection" style="display:none">
<textarea id="bulkOut" readonly></textarea>
</div>
<div class="kofi" style="text-align:center;margin-bottom:12px;padding:10px;background:#1e1e3a;border-radius:8px"><a href="https://ko-fi.com/pyfiletoolkit" target="_blank" style="color:#ff5e5b;font-weight:600;text-decoration:none">☕ Support this tool on Ko-fi</a></div>
<div class="ads">
<a href="https://pyfile-toolkit.github.io/web-toolkit/">← Toolkit</a> | 
<a href="https://pyfile-toolkit.github.io/web-toolkit/json-formatter.html">JSON Formatter</a> |
<a href="https://pyfiletoolkit.gumroad.com/">Premium</a>

<a href="https://pyfile-toolkit.github.io/web-toolkit/youtube-tag-generator.html">YouTube Tags</a>
</div>
</div>
<script>
function gen(){document.getElementById('uuid').textContent=crypto.randomUUID()}
function copy(){const t=document.getElementById('uuid').textContent;if(t!=='Click generate...')navigator.clipboard.writeText(t)}
function bulk(){const s=document.getElementById('bulkSection');s.style.display='block';const a=Array.from({length:10},()=>crypto.randomUUID());document.getElementById('bulkOut').value=a.join('\n')}
gen();
</script>

<div id="crypto-donate"></div>
<script src="donate.js"></script>
</body>
</html>
