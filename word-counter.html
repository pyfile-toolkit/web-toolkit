<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Word Counter</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}.header{width:100%;background:#1e293b;padding:14px 24px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}.header h1{font-size:17px}.header a{color:#3b82f6;text-decoration:none;font-size:13px}.container{flex:1;padding:30px 20px;max-width:600px;width:100%}h2{font-size:22px;margin-bottom:6px}.sub{color:#94a3b8;margin-bottom:20px;font-size:14px}textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:14px;margin-bottom:16px;min-height:120px;resize:vertical}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}.stat{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:16px;text-align:center}.stat .num{font-size:28px;font-weight:700;color:#10b981}.stat .label{font-size:12px;color:#94a3b8;margin-top:4px}.footer{width:100%;text-align:center;padding:12px;color:#475569;font-size:12px;border-top:1px solid #1e293b;margin-top:auto}.footer a{color:#64748b}</style></head><body>
<div class="header"><h1>📝 Word Counter</h1><a href="https://pyfile-toolkit.github.io/web-toolkit/">← Tools</a></div>
<div class="container"><h2>Count Words & Characters</h2><p class="sub">Real-time word count, character count, and reading time</p>
<textarea id="input" placeholder="Type or paste text..." oninput="count()">The quick brown fox jumps over the lazy dog. This is a sample text to demonstrate the word counter tool.</textarea>
<div class="stats"><div class="stat"><div class="num" id="words">0</div><div class="label">Words</div></div><div class="stat"><div class="num" id="chars">0</div><div class="label">Characters</div></div><div class="stat"><div class="num" id="time">0</div><div class="label">Min read</div></div><div class="stat"><div class="num" id="lines">0</div><div class="label">Lines</div></div><div class="stat"><div class="num" id="sent">0</div><div class="label">Sentences</div></div><div class="stat"><div class="num" id="charsns">0</div><div class="label">No spaces</div></div></div></div>
<div class="footer"><a href="https://pyfiletoolkit.gumroad.com">PRO: bulk text analysis</a></div>
<script>
function count(){const t=document.getElementById('input').value;document.getElementById('words').textContent=t.split(/\\s+/).filter(w=>w.length).length;document.getElementById('chars').textContent=t.length;document.getElementById('charsns').textContent=t.replace(/\\s/g,'').length;document.getElementById('lines').textContent=(t.match(/\\n/g)||[]).length+1;document.getElementById('sent').textContent=(t.match(/[.!?]+/g)||[]).length||1;document.getElementById('time').textContent=Math.max(1,Math.round(t.split(/\\s+/).filter(w=>w.length).length/200))}
count()
</script></body></html>
