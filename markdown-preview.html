<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px}
.card{max-width:900px;margin:0 auto;background:#1e293b;border-radius:16px;padding:32px}
h1{text-align:center;color:#f8fafc;margin-bottom:4px}
.sub{text-align:center;color:#94a3b8;margin-bottom:20px;font-size:.9rem}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel h3{color:#f8fafc;margin-bottom:8px;font-size:.9rem}
textarea{width:100%;padding:12px;border-radius:8px;background:#334155;color:#e2e8f0;border:1px solid #475569;font-family:monospace;font-size:.85rem;resize:vertical;min-height:300px}
.preview{background:#1e1e3a;border:1px solid #334155;border-radius:8px;padding:16px;min-height:300px;overflow-y:auto}
.preview h1{color:#f8fafc;font-size:1.4rem;margin:16px 0 8px;text-align:left}
.preview h2{color:#f8fafc;font-size:1.2rem;margin:12px 0 6px}
.preview p{color:#cbd5e1;margin:8px 0}
.preview code{background:#334155;padding:2px 6px;border-radius:4px;font-size:.85rem}
.preview pre{background:#0f172a;padding:12px;border-radius:8px;overflow-x:auto}
.preview a{color:#818cf8}
.btns{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
button{padding:8px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem}
.btn-exp{background:#22c55e;color:#fff}
.btn-copy{background:#64748b;color:#fff}
.ads{margin-top:16px;padding:12px;background:#1e1e3a;border-radius:8px;text-align:center;font-size:.85rem}
.ads a{color:#818cf8}
</style>
</head>
<body>
<div class="card">
<h1>📝 Markdown Previewer</h1>
<p class="sub">Type markdown on the left — see rendered HTML on the right</p>
<div class="panels">
<div class="panel">
<h3>Markdown</h3>
<textarea id="input" placeholder="# Hello World&#10;&#10;This is **bold** and *italic*&#10;&#10;- List item 1&#10;- List item 2&#10;&#10;[Link](https://example.com)&#10;&#10;`inline code`"># Hello World

This is **bold** and *italic*

- List item 1
- List item 2

[Link](https://example.com)

`inline code`</textarea>
</div>
<div class="panel">
<h3>Preview</h3>
<div class="preview" id="preview"></div>
</div>
</div>
<div class="btns">
<button class="btn-exp" onclick="exportHTML()">📥 Export HTML</button>
<button class="btn-copy" onclick="copyPreview()">📋 Copy HTML</button>
</div>
</div>
<script>
const inp=document.getElementById('input'),prev=document.getElementById('preview');
function render(){
  let md=inp.value;
  // Headers
  md=md.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  md=md.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  md=md.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // Bold, italic
  md=md.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  md=md.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Links
  md=md.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  // Inline code
  md=md.replace(/`([^`]+)`/g,'<code>$1</code>');
  // Lists
  md=md.replace(/^- (.+)$/gm,'<li>$1</li>');
  md=md.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
  // Paragraphs
  md=md.replace(/^(?!<[hul/])(.+)$/gm,'<p>$1</p>');
  prev.innerHTML=md;
}
inp.addEventListener('input',render);
render();

</body>
</html>
