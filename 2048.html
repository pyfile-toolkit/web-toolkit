<script>
let grid=[],score=0,best=0,over=false,won=false;
const board=document.getElementById('board');
function blank(){return Array(4).fill().map(()=>Array(4).fill(0))}
function emptyCells(){const c=[];for(let r=0;r<4;r++)for(let i=0;i<4;i++)if(!grid[r][i])c.push([r,i]);return c}
function addTile(){const c=emptyCells();if(!c.length)return;const [r,i]=c[Math.floor(Math.random()*c.length)];grid[r][i]=Math.random()<.9?2:4}
function render(){
  const tiles=[];for(let r=0;r<4;r++)for(let i=0;i<4;i++){
    const v=grid[r][i],cls=v?'t'+v:'';tiles.push(`<div class="tile ${cls}">${v||''}</div>`);
  }
  board.innerHTML=tiles.join('');
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
}
function compress(row){const a=row.filter(x=>x);for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;score+=a[i];if(a[i]===2048)won=true;a.splice(i+1,1);}}while(a.length<4)a.push(0);return a}
function move(dir){
  const before=JSON.stringify(grid);
  for(let i=0;i<4;i++){
    let col=[];
    for(let r=0;r<4;r++)col.push(dir==='up'?grid[r][i]:(dir==='down'?grid[3-r][i]:(dir==='left'?grid[i][r]:grid[i][3-r])));
    col=compress(col);
    for(let r=0;r<4;r++){
      const v=dir==='up'?col[r]:(dir==='down'?col[3-r]:(dir==='left'?col[r]:col[3-r]));
      if(dir==='up'||dir==='down')grid[r][i]=v;else grid[i][r]=v;
    }
  }
  if(JSON.stringify(grid)!==before){addTile();render();checkOver();}
}
function checkOver(){
  if(wincheck()){document.getElementById('msg').textContent=won?'🎉 You won! Keep going...':'Game Over';}
  if(!emptyCells().length){for(let r=0;r<4;r++)for(let i=0;i<4;i++){if(i<3&&grid[r][i]===grid[r][i+1])return;if(r<3&&grid[r][i]===grid[r+1][i])return;}document.getElementById('msg').textContent='Game Over';}
}
function wincheck(){const lk=JSON.parse(localStorage.getItem('best2048')||'0');if(score>lk){best=score;localStorage.setItem('best2048',score)}return lk}
function reset(){grid=blank();score=0;over=false;won=false;document.getElementById('msg').textContent='';addTile();addTile();render()}
document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp')move('up');else if(k==='ArrowDown')move('down');else if(k==='ArrowLeft')move('left');else if(k==='ArrowRight')move('right');else return;e.preventDefault()});
let tx=null,ty=null;
board.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;e.preventDefault()},{passive:false});
board.addEventListener('touchend',e=>{if(tx===null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;const adx=Math.abs(dx),ady=Math.abs(dy);if(Math.max(adx,ady)<20){return}if(adx>ady){move(dx>0?'right':'left')}else{move(dy>0?'down':'up')}tx=ty=null;e.preventDefault()},{passive:false});
best=parseInt(localStorage.getItem('best2048')||'0');reset();
</script>
