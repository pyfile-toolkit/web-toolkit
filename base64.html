<title>Base64 Encoder/Decoder — Free Online Tool</title>
<meta name="description" content="Encode and decode Base64 strings instantly in your browser. Free, no upload, 100% local.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{background:#1e293b;border-radius:16px;padding:32px;max-width:550px;width:100%}
h1{color:#f8fafc;margin-bottom:8px;text-align:center}
.sub{color:#94a3b8;margin-bottom:20px;text-align:center;font-size:.9rem}
textarea{width:100%;padding:12px;border-radius:8px;background:#334155;color:#e2e8f0;border:1px solid #475569;resize:vertical;font-size:1rem;min-height:100px;margin-bottom:12px}
.btns{display:flex;gap:10px;justify-content:center}
button{padding:10px 28px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.95rem}
.btn-enc{background:#6366f1;color:#fff}
.btn-dec{background:#22c55e;color:#fff}
.btn-enc:hover{background:#4f46e5}
.btn-dec:hover{background:#16a34a}
.result{margin-top:16px}
.result label{color:#94a3b8;font-size:.85rem}
.ads{margin-top:20px;padding:12px;background:#1e1e3a;border-radius:8px;text-align:center;font-size:.85rem}
.ads a{color:#818cf8}
</style>

<body>
<div class="card">
<h1>Base64 Encoder / Decoder</h1>
<p class="sub">Paste text → encode or decode instantly. No server, 100% local.</p>
<textarea id="input" placeholder="Paste text here..."></textarea>
<div class="btns">
<button class="btn-enc" onclick="encode()">🔒 Encode</button>
<button class="btn-dec" onclick="decode()">🔓 Decode</button>
</div>
<div class="result">
<label>Result:</label>
<textarea id="output" readonly style="min-height:100px"></textarea>
</div>
<div class="kofi" style="text-align:center;margin-bottom:12px;padding:10px;background:#1e1e3a;border-radius:8px"><a href="https://ko-fi.com/pyfiletoolkit" target="_blank" style="color:#ff5e5b;font-weight:600;text-decoration:none">☕ Support this tool on Ko-fi</a></div>

<script>
const inp=document.getElementById('input'),out=document.getElementById('output');
function encode(){try{out.value=btoa(inp.value)}catch(e){out.value='Error: invalid characters for Base64'}}
function decode(){try{out.value=atob(inp.value)}catch(e){out.value='Error: not valid Base64'}}
</script>
