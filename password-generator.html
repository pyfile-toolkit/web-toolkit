<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Password Generator</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}.header{width:100%;background:#1e293b;padding:14px 24px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}.header h1{font-size:17px}.header a{color:#3b82f6;text-decoration:none;font-size:13px}.container{flex:1;padding:30px 20px;max-width:600px;width:100%}h2{font-size:22px;margin-bottom:6px}.sub{color:#94a3b8;margin-bottom:20px;font-size:14px}.opts{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px}.opts label{display:flex;align-items:center;gap:8px;color:#cbd5e1;font-size:14px;cursor:pointer}input[type=range]{width:100%}.len-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}.len-row span{color:#3b82f6;font-weight:700;font-size:18px;min-width:30px}.output{background:#0f172a;border:2px solid #334155;border-radius:10px;padding:20px;font-family:monospace;font-size:28px;text-align:center;word-break:break-all;color:#10b981;letter-spacing:2px;margin:16px 0;cursor:pointer;user-select:all}.output:hover{border-color:#3b82f6}.btn{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600}.btn:hover{background:#2563eb}.strength{text-align:center;margin:8px 0;font-size:13px;color:#94a3b8}.footer{width:100%;text-align:center;padding:12px;color:#475569;font-size:12px;border-top:1px solid #1e293b}.footer a{color:#64748b}</style></head><body>
<div class="header"><h1>🔐 Password Generator</h1><a href="https://pyfile-toolkit.github.io/web-toolkit/">← Tools</a></div>
<div class="container"><h2>Generate Secure Password</h2><p class="sub">Cryptographically secure passwords with custom rules</p>
<div class="opts"><label><input type="checkbox" id="upper" checked> A-Z</label><label><input type="checkbox" id="lower" checked> a-z</label><label><input type="checkbox" id="nums" checked> 0-9</label><label><input type="checkbox" id="sym"> !@#$</label></div>
<div class="len-row"><span id="lenval">16</span><input type="range" id="len" min="8" max="64" value="16"></div>
<div class="output" id="pw" onclick="gen()">Click Generate</div>
<button class="btn" onclick="gen()">🔄 Generate New</button>
<div class="strength" id="str"></div></div>
<div class="footer"><a href="https://pyfiletoolkit.gumroad.com">PRO: bulk generator + password manager</a> · <a href="https://pyfile-toolkit.github.io/web-toolkit/">More tools</a></div>
<script>
function gen(){const u='ABCDEFGHIJKLMNOPQRSTUVWXYZ',l='abcdefghijklmnopqrstuvwxyz',n='0123456789',s='!@#$%^&*()_+-=[]{}|;:,.<>?';let chars='';if(document.getElementById('upper').checked)chars+=u;if(document.getElementById('lower').checked)chars+=l;if(document.getElementById('nums').checked)chars+=n;if(document.getElementById('sym').checked)chars+=s;if(!chars)chars=l+n;const len=document.getElementById('len').value;let pw='';const arr=new Uint32Array(len);crypto.getRandomValues(arr);for(let i=0;i<len;i++)pw+=chars[arr[i]%chars.length];document.getElementById('pw').textContent=pw;const s2=pw.length>=16&&/[A-Z]/.test(pw)&&/[a-z]/.test(pw)&&/[0-9]/.test(pw)&&/[^A-Za-z0-9]/.test(pw)?'🟢 Strong':pw.length>=12?'🟡 Medium':'🔴 Weak';document.getElementById('str').textContent='Strength: '+s2}
document.getElementById('len').oninput=function(){document.getElementById('lenval').textContent=this.value;gen()}
gen()
</script></body></html>
